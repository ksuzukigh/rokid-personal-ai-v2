<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
<title id="title">外出先では、スマホが通信を中継</title><desc id="desc">スマホ経由の利用条件。眼鏡はBluetoothでHi Rokidとつながり、オンラインのスマホが通信を中継する。Macは起動してログインし、受付と通信が稼働する。</desc>
<style>text { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }</style>
<rect width="960" height="960" fill="white"/>
<text x="48" y="72" font-size="43" font-weight="700" fill="#172b25">外出先では、スマホが通信を中継</text><text x="48" y="121" font-size="30" font-weight="400" fill="#435b52">スマホ経由で使う場合の条件を示す図</text>
<rect x="48" y="166" width="864" height="145" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><g transform="translate(82,209)" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round"><rect x="0" y="15" width="42" height="38" rx="10"/><rect x="58" y="15" width="42" height="38" rx="10"/><path d="M42 30 Q50 23 58 30 M0 20 L-8 5 M100 20 L108 5"/></g><text x="228" y="221" font-size="34" font-weight="700" fill="#172b25">眼鏡：Rokid AI Glasses RV101</text><text x="228" y="272" font-size="30" font-weight="400" fill="#172b25">声を受け取り、質問や返事を表示する。</text><path d="M480 329 V365 M470 341 L480 329 L490 341 M470 353 L480 365 L490 353" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="527" y="359" font-size="30" font-weight="400" fill="#172b25">Bluetoothで接続</text><rect x="48" y="389" width="864" height="230" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><g transform="translate(82,448)" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round"><rect x="20" y="-12" width="60" height="96" rx="10"/><path d="M42 -2 H58 M42 72 H58"/></g><text x="228" y="443" font-size="34" font-weight="700" fill="#172b25">スマホ：通信を中継する</text><text x="228" y="491" font-size="30" font-weight="400" fill="#172b25">Hi Rokidが起動し、眼鏡と通信できる。</text><text x="228" y="537" font-size="28" font-weight="400" fill="#172b25">スマホがインターネットにつながっている。</text><path d="M480 638 V674 M470 650 L480 638 L490 650 M470 662 L480 674 L490 662" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="527" y="669" font-size="30" font-weight="400" fill="#172b25">インターネット経由</text><rect x="48" y="697" width="864" height="158" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><g transform="translate(82,740)" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round"><rect x="0" y="0" width="100" height="65" rx="6"/><path d="M50 65 V82 M20 82 H80"/></g><text x="228" y="750" font-size="34" font-weight="700" fill="#172b25">Mac：調査や作業を進める</text><text x="228" y="798" font-size="30" font-weight="400" fill="#172b25">起動・ログイン済み。受付と通信が動く。</text>
</svg>