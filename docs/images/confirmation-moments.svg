<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
<title id="title">確認するのは、行き先と変更内容</title><desc id="desc">別のチャットや新しいチャットは、実際のチャット名を確認する。文書の保存や編集は対象と内容を別に確認する。録音開始のタップを文書変更の許可にしない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245c4a"/></marker></defs>
<style>text { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }</style>
<rect width="960" height="960" fill="white"/>
<text x="48" y="72" font-size="43" font-weight="700" fill="#172b25">確認するのは、行き先と変更内容</text><text x="48" y="121" font-size="30" font-weight="400" fill="#435b52">相談先の確認と、文書を変える確認は別（架空の例）</text>
<rect x="48" y="165" width="864" height="309" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><text x="80" y="219" font-size="34" font-weight="700" fill="#172b25">別の相談へ移る／新しい相談を始める</text><text x="80" y="270" font-size="36" font-weight="700" fill="#245c4a">画面のチャット名を確認</text><rect x="80" y="299" width="800" height="72" rx="20" fill="white" stroke="#81aa96" stroke-width="2"/><text x="103" y="346" font-size="32" font-weight="400" fill="#172b25">続ける会話：業務改善の説明資料</text><text x="80" y="422" font-size="32" font-weight="400" fill="#172b25">確認して返事 → そのチャットへ依頼が届く</text><rect x="48" y="526" width="864" height="296" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><text x="80" y="580" font-size="34" font-weight="700" fill="#172b25">文書を保存・編集する</text><text x="80" y="635" font-size="36" font-weight="700" fill="#245c4a">どの文書へ、何をするかを確認</text><rect x="80" y="666" width="800" height="68" rx="20" fill="white" stroke="#81aa96" stroke-width="2"/><text x="103" y="711" font-size="32" font-weight="400" fill="#172b25">例：説明メモの末尾に、注意点を追記</text><text x="80" y="778" font-size="30" font-weight="400" fill="#172b25">確認して返事 → 文書を変更し、結果を確かめる</text><text x="48" y="882" font-size="30" font-weight="700" fill="#172b25">録音開始のタップは、文書変更の許可にはならない。</text><text x="48" y="928" font-size="28" font-weight="400" fill="#435b52">同じチャットの普通の続きでは、行き先を毎回確認しない。</text>
</svg>