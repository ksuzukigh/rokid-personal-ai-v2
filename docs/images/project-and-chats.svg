<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
<title id="title">続ける場所は、一つのチャット</title><desc id="desc">業務改善というプロジェクトの中に、説明資料の下書きと参考情報の調査という別々のチャットがある。眼鏡から続けるのは選んだ一つのチャット。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245c4a"/></marker></defs>
<style>text { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }</style>
<rect width="960" height="960" fill="white"/>
<text x="48" y="72" font-size="43" font-weight="700" fill="#172b25">続ける場所は、一つのチャット</text><text x="48" y="121" font-size="30" font-weight="400" fill="#435b52">プロジェクトは「まとめる場所」（架空の例）</text>
<rect x="48" y="174" width="864" height="549" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><text x="81" y="231" font-size="38" font-weight="700" fill="#172b25">プロジェクト「業務改善」</text><text x="81" y="279" font-size="32" font-weight="400" fill="#172b25">関連する相談や資料をまとめる場所</text><rect x="80" y="318" width="800" height="169" rx="20" fill="white" stroke="#245c4a" stroke-width="2"/><text x="111" y="365" font-size="34" font-weight="700" fill="#172b25">チャット「説明資料の下書き」</text><text x="111" y="410" font-size="30" font-weight="400" fill="#172b25">依頼とAIの返事を、ここへ積み重ねる。</text><text x="111" y="454" font-size="30" font-weight="700" fill="#245c4a">眼鏡で続きを話す先も、このチャット。</text><rect x="80" y="525" width="800" height="139" rx="20" fill="white" stroke="#81aa96" stroke-width="2"/><text x="111" y="575" font-size="34" font-weight="700" fill="#172b25">チャット「参考情報の調査」</text><text x="111" y="622" font-size="32" font-weight="400" fill="#172b25">別の相談は、別のチャットへ。</text><rect x="48" y="774" width="864" height="139" rx="20" fill="white" stroke="#81aa96" stroke-width="2"/><text x="81" y="823" font-size="30" font-weight="400" fill="#172b25">プロジェクトに入っていないチャットもある。</text><text x="81" y="869" font-size="30" font-weight="400" fill="#172b25">「スレッド」も、一続きのやり取りの呼び方。</text>
</svg>