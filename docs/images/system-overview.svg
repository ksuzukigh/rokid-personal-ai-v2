<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">声がMacの相談へ届き、返事が眼鏡へ戻る</title>
  <desc id="desc">眼鏡は声を受け取り返事を表示する。スマホのHi Rokidが通信を中継し、Macで音声を文字に変える。受付役のAIが相談先を案内し、選んだChatGPT Workのチャットが調査や作業を進める。質問、途中経過、返事が眼鏡へ戻る。</desc>
  <style>
    text {font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;fill:#172b25;}
    .title {font-size:41px;font-weight:700;}
    .heading {font-size:34px;font-weight:700;}
    .body {font-size:30px;}
    .label {font-size:28px;fill:#435b52;}
    .line {fill:none;stroke:#245c4a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}
  </style>
  <rect width="960" height="960" fill="white"/>
  <text x="48" y="73" class="title">眼鏡で話す。Macで進める。返事が戻る。</text>
  <text x="48" y="124" class="body">眼鏡とMac、それぞれの役割</text>

  <rect x="48" y="171" width="864" height="158" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/>
  <g transform="translate(79,219)" class="line">
    <path d="M7 13 Q22 5 57 11 Q69 14 68 35 Q67 59 43 60 L24 60 Q7 59 5 40 Z M84 13 Q105 5 141 12 L143 40 Q140 59 122 60 L102 60 Q80 59 79 35 Q78 15 84 13 Z"/>
    <path d="M68 23 Q74 15 80 23 M7 16 L-4 0 M142 16 L153 0"/>
  </g>
  <text x="265" y="232" class="heading">眼鏡：声と表示の入口</text>
  <text x="265" y="285" class="body">声で依頼し、質問や返事を読む。</text>

  <path d="M240 350 V415 M230 403 L240 415 L250 403" class="line"/>
  <text x="288" y="390" class="label">音声</text>
  <path d="M748 415 V350 M738 362 L748 350 L758 362" class="line"/>
  <text x="492" y="375" class="label">質問・途中経過</text>
  <text x="492" y="411" class="label">・返事</text>

  <rect x="48" y="450" width="864" height="448" rx="20" fill="#f5f8f6" stroke="#81aa96" stroke-width="2"/>
  <text x="80" y="500" class="heading">Mac：相談と作業を進める</text>
  <rect x="80" y="528" width="800" height="96" rx="14" fill="white" stroke="#b9c9c1" stroke-width="2"/>
  <text x="108" y="568" class="heading">音声を文字にする</text>
  <text x="108" y="605" class="body">話した内容を、AIへ渡せる文章に変える。</text>
  <path d="M480 630 V646 M472 638 L480 646 L488 638" class="line"/>
  <rect x="80" y="657" width="800" height="96" rx="14" fill="white" stroke="#b9c9c1" stroke-width="2"/>
  <text x="108" y="697" class="heading">受付役のAI：続けるチャットを案内</text>
  <text x="108" y="734" class="body">今の相談、別の相談、新しい相談へ。</text>
  <path d="M480 759 V775 M472 767 L480 775 L488 767" class="line"/>
  <rect x="80" y="786" width="800" height="96" rx="14" fill="#e4f1e8" stroke="#548c6c" stroke-width="2"/>
  <text x="108" y="826" font-size="32" font-weight="700">ChatGPT Work：調べる・考える・作る</text>
  <text x="108" y="863" class="body">選んだチャットのやり取りや資料を使う。</text>
  <text x="48" y="944" class="label">スマホのHi Rokidが、眼鏡とMacの通信を中継する。</text>
</svg>
