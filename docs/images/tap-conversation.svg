<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
<title id="title">話す・止める・返事を読む</title><desc id="desc">アプリを開いただけでは録音しない。テンプル1回で開始、話し終わったらもう1回で終了。返事を読み、続ける時も1回で録音を始める。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245c4a"/></marker></defs>
<style>text { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }</style>
<rect width="960" height="960" fill="white"/>
<text x="48" y="72" font-size="43" font-weight="700" fill="#172b25">話す・止める・返事を読む</text><text x="48" y="121" font-size="30" font-weight="400" fill="#435b52">続きを話す1回のタップで、そのまま録音開始</text>
<rect x="48" y="157" width="864" height="108" rx="20" fill="white" stroke="#81aa96" stroke-width="2"/><circle cx="91" cy="202" r="30" fill="#245c4a"/><text x="80" y="214" font-size="32" font-weight="700" fill="white">1</text><text x="145" y="200" font-size="34" font-weight="700" fill="#172b25">「私のAI」を開く</text><text x="145" y="241" font-size="30" font-weight="400" fill="#172b25">開いただけでは録音しない。</text><path d="M480 267 V303" fill="none" stroke="#245c4a" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="297" width="864" height="108" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><circle cx="91" cy="342" r="30" fill="#245c4a"/><text x="80" y="354" font-size="32" font-weight="700" fill="white">2</text><text x="145" y="340" font-size="34" font-weight="700" fill="#172b25">テンプルを1回タップ → 話す</text><text x="145" y="381" font-size="30" font-weight="400" fill="#172b25">表示は「タップして話す」。</text><path d="M480 407 V443" fill="none" stroke="#245c4a" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="437" width="864" height="108" rx="20" fill="white" stroke="#81aa96" stroke-width="2"/><circle cx="91" cy="482" r="30" fill="#245c4a"/><text x="80" y="494" font-size="32" font-weight="700" fill="white">3</text><text x="145" y="480" font-size="34" font-weight="700" fill="#172b25">話し終えたら、もう1回タップ</text><text x="145" y="521" font-size="30" font-weight="400" fill="#172b25">録音を終え、Macへ音声を送る。</text><path d="M480 547 V583" fill="none" stroke="#245c4a" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="577" width="864" height="108" rx="20" fill="white" stroke="#81aa96" stroke-width="2"/><circle cx="91" cy="622" r="30" fill="#245c4a"/><text x="80" y="634" font-size="32" font-weight="700" fill="white">4</text><text x="145" y="620" font-size="34" font-weight="700" fill="#172b25">AIの質問・途中経過・返事を読む</text><text x="145" y="661" font-size="30" font-weight="400" fill="#172b25">必要な確認があれば、内容を確かめる。</text><path d="M480 687 V723" fill="none" stroke="#245c4a" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="717" width="864" height="108" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><circle cx="91" cy="762" r="30" fill="#245c4a"/><text x="80" y="774" font-size="32" font-weight="700" fill="white">5</text><text x="145" y="760" font-size="34" font-weight="700" fill="#172b25">続きを話すときも、1回タップ</text><text x="145" y="801" font-size="30" font-weight="400" fill="#172b25">表示は「タップして続けて話す」。</text><text x="48" y="916" font-size="30" font-weight="400" fill="#435b52">つる（テンプル）のタッチ部分を使う。最長60秒。</text>
</svg>