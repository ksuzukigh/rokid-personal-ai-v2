<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
<title id="title">できたことと、未確認のことを分ける</title><desc id="desc">作者のRV101とMac環境で相談継続、調査と資料作成、確認後の文書変更を確認。ほかの人や機器、「私のAI」終了中の眼鏡への通知、全種類の操作は未確認。公開資料には完成アプリを含めない。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245c4a"/></marker></defs>
<style>text { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }</style>
<rect width="960" height="960" fill="white"/>
<text x="48" y="72" font-size="43" font-weight="700" fill="#172b25">できたことと、未確認のことを分ける</text><text x="48" y="121" font-size="30" font-weight="400" fill="#435b52">公開READMEの検証要約（2026年9月26日まで）</text>
<rect x="48" y="169" width="864" height="291" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><text x="80" y="222" font-size="36" font-weight="700" fill="#245c4a">作者のRV101＋Mac環境で確認</text><text x="80" y="283" font-size="34" font-weight="400" fill="#172b25">・同じチャットで相談を続ける</text><text x="80" y="338" font-size="34" font-weight="400" fill="#172b25">・調査からメモやスライドを作る</text><text x="80" y="393" font-size="34" font-weight="400" fill="#172b25">・確認後に、文書や指定セルを変える</text><text x="80" y="434" font-size="28" font-weight="400" fill="#435b52">使える資料・道具は、本人の設定と権限による。</text><rect x="48" y="501" width="864" height="287" rx="20" fill="#f5f7f5" stroke="#b9c9c1" stroke-width="2"/><text x="80" y="555" font-size="36" font-weight="700" fill="#172b25">まだ確認していない</text><text x="80" y="613" font-size="34" font-weight="400" fill="#172b25">・ほかの人の環境や、別の機器</text><text x="80" y="668" font-size="34" font-weight="400" fill="#172b25">・アプリ終了中や、腕時計への通知</text><text x="80" y="723" font-size="34" font-weight="400" fill="#172b25">・送信・公開など、あらゆる操作</text><rect x="48" y="827" width="864" height="110" rx="20" fill="#245c4a" stroke="#245c4a" stroke-width="2"/><text x="81" y="872" font-size="30" font-weight="700" fill="white">この公開ページは、考え方と作るための参考資料。</text><text x="81" y="917" font-size="30" font-weight="700" fill="white">完成アプリやインストーラーは配布していない。</text>
</svg>