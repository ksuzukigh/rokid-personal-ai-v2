<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
<title id="title">Macの相談を、眼鏡から続ける</title><desc id="desc">Macで始めた説明資料の相談を、離席中に眼鏡から声で続け、机に戻ったら同じチャットで仕上げる。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#245c4a"/></marker></defs>
<style>text { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif; }</style>
<rect width="960" height="960" fill="white"/>
<text x="48" y="72" font-size="43" font-weight="700" fill="#172b25">Macの相談を、眼鏡から続ける</text><text x="48" y="121" font-size="30" font-weight="400" fill="#435b52">説明資料づくりの場面（架空の例）</text>
<rect x="48" y="165" width="864" height="180" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><circle cx="89" cy="205" r="30" fill="#245c4a"/><text x="78" y="217" font-size="32" font-weight="700" fill="white">1</text><text x="142" y="215" font-size="36" font-weight="700" fill="#172b25">机で、資料の相談を始める</text><g transform="translate(76,250)" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round"><rect x="0" y="0" width="100" height="65" rx="6"/><path d="M50 65 V82 M20 82 H80"/></g><text x="218" y="270" font-size="32" font-weight="400" fill="#172b25">私：業務改善の説明資料を考えたい。</text><text x="218" y="316" font-size="32" font-weight="400" fill="#172b25">MacのChatGPT Workで相談する。</text><path d="M480 350 V386" fill="none" stroke="#245c4a" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="385" width="864" height="180" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><circle cx="89" cy="425" r="30" fill="#245c4a"/><text x="78" y="437" font-size="32" font-weight="700" fill="white">2</text><text x="142" y="435" font-size="36" font-weight="700" fill="#172b25">席を離れて、思いつきを伝える</text><g transform="translate(76,470)" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round"><rect x="0" y="15" width="42" height="38" rx="10"/><rect x="58" y="15" width="42" height="38" rx="10"/><path d="M42 30 Q50 23 58 30 M0 20 L-8 5 M100 20 L108 5"/></g><text x="218" y="490" font-size="32" font-weight="400" fill="#172b25">私：導入の注意点も入れたい。</text><text x="218" y="536" font-size="32" font-weight="400" fill="#172b25">眼鏡から声で、同じ相談を続ける。</text><path d="M480 570 V606" fill="none" stroke="#245c4a" stroke-width="4" marker-end="url(#arrow)"/><rect x="48" y="605" width="864" height="180" rx="20" fill="#eaf5ee" stroke="#81aa96" stroke-width="2"/><circle cx="89" cy="645" r="30" fill="#245c4a"/><text x="78" y="657" font-size="32" font-weight="700" fill="white">3</text><text x="142" y="655" font-size="36" font-weight="700" fill="#172b25">机に戻って、続きを仕上げる</text><g transform="translate(76,690)" fill="none" stroke="#245c4a" stroke-width="4" stroke-linecap="round"><rect x="0" y="0" width="100" height="65" rx="6"/><path d="M50 65 V82 M20 82 H80"/></g><text x="218" y="710" font-size="32" font-weight="400" fill="#172b25">同じチャットをMacで開く。</text><text x="218" y="756" font-size="32" font-weight="400" fill="#172b25">大きな画面で下書きを確認する。</text><rect x="48" y="829" width="864" height="86" rx="20" fill="#245c4a" stroke="#245c4a" stroke-width="2"/><text x="99" y="884" font-size="32" font-weight="700" fill="white">同じチャットだから、相談の前提を引き継げる</text>
</svg>